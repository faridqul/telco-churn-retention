[project]
name = "ml-projects-4"
version = "0.1.0"
description = "Profit-optimized customer churn prediction and retention targeting for telecom, with FastAPI deployment"
readme = "README.md"
authors = [
    { name = "yaponskihue", email = "faridlvrl@gmail.com" }
]
requires-python = ">=3.12"
# Everything needed to SERVE a prediction: load the pickled pipeline, build
# the engineered features, and answer a request. Nothing here is only used
# for training or plotting. This is the set a production image installs, so
# adding to it has a direct cost in image size and attack surface.
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.3",
    "xgboost>=3.4.1",
]

[dependency-groups]
# Installed by default by `uv sync`, which is what CI relies on: the test
# suite needs the runtime set plus these two and nothing else. httpx is not
# imported directly -- it is what fastapi's TestClient runs on.
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

# Only needed to NARRATE an explanation (narrate.py). Not installed by
# default, and deliberately not in [project.dependencies]: neither api.py nor
# telco_model.py imports it, the decision path must never depend on a
# third-party network call, and adding it to the runtime set would grow the
# production image for a feature the image does not serve. narrate.py imports
# the SDK lazily, inside OpenAIClient.__init__, so everything except a real
# API call works without this group installed. Install with
# `uv sync --group llm`.
llm = [
    "openai>=1.0.0",
]

# Only needed to RE-TRAIN the model by running the notebook. Not installed by
# default, so neither CI nor a production image pays for a Jupyter and
# plotting stack to score a customer. Install with `uv sync --group notebook`.
notebook = [
    "jupyter>=1.1.1",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
]

[tool.pytest.ini_options]
# `live` marks the tests that spend money: they call a real language model
# API. They are excluded by default rather than merely skipped, so a
# developer who has exported OPENAI_API_KEY does not pay for a full API run
# on every `uv run pytest -q`. CI never selects them. Run them deliberately:
#   uv run pytest -m live
markers = [
    "live: hits a real third-party API (needs OPENAI_API_KEY; costs money)",
]
addopts = "-m 'not live'"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
